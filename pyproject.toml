[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-installer"
version = "1.2.0"
authors = [
  { name="Antigravity Team", email="antigravity@google.com" },
]
description = "Graphical Installer and Manager for Google Antigravity Suite on Linux x64"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "PyGObject>=3.42.0",
]

[project.scripts]
antigravity-installer = "antigravity_installer.main:main"
